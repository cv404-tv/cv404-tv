        <path fill="#909090" stroke="#909090" d="M 163 162 L 190.25 179.75 L 190.25 207 L 163 189.25 Z"/>
        <path fill="#DCDCDC" stroke="#DCDCDC" d="M 124 225 L 153.25 206 L 182.5 225 L 153.25 244 Z"/>
        <path fill="#B8B8B8" stroke="#B8B8B8" d="M 209.75 179.5 L 237 161.75 L 237 242.25 L 163 290.5 L 163 260.75 L 209.75 230.25 Z"/>
