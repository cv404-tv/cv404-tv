<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">可拼合的双箭头长方体</title>
  <desc id="desc">透明背景。尺寸比一比二比三的长方体，沿下行一、横行一、再下行一的阶梯线切成两块；两块在等轴测视角下分离展示。</desc>

  <!-- 正面为 3 × 2：长度单位沿 (50,30)，高度单位沿 (0,60)；厚度单位沿 (-50,30)。 -->
  <!-- 拼合时的切线依次为 (1,0) → (1,1) → (2,1) → (2,2)。 -->
  <!-- 上块移 (+35,-30)，下块移 (-35,+30)；将位移撤销后可拼回 1 × 2 × 3 长方体。 -->
  <g id="upper-arrow" aria-label="上方箭头" stroke="#171717" stroke-width="5" stroke-linejoin="round">
    <path d="M235 65 335 125 335 245 285 215 285 155 235 125Z" fill="#171717"/>
    <path d="M235 65 335 125 285 155 185 95Z" fill="#565656"/>
    <path d="M235 65 235 125 185 155 185 95Z M285 155 285 215 235 245 235 185Z" fill="#343434"/>
  </g>

  <g id="lower-arrow" aria-label="下方箭头" stroke="#171717" stroke-width="5" stroke-linejoin="round">
    <path d="M115 95 165 125 165 185 215 215 215 275 115 215Z" fill="#171717"/>
    <path d="M115 95 165 125 115 155 65 125Z M165 185 215 215 165 245 115 215Z" fill="#565656"/>
    <path d="M115 95 115 215 65 245 65 125Z" fill="#343434"/>
  </g>
</svg>
